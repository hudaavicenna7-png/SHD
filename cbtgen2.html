<!DOCTYPE html> 
<html lang="id"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
<title>CBT Ujian Biologi - Gen, Kromosom, DNA, dan RNA</title> 
<style> 
* { box-sizing: border-box; } 
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; } 
.container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); } 

/* Form Identitas */ 
.identity-card { background: #f8f9fa; border: 1px solid #e1e4e8; padding: 25px; border-radius: 10px; margin-bottom: 20px; } 
.form-group { margin-bottom: 15px; } 
.form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; } 
.form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; } 
.btn-start { background: #27ae60; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: bold; width: 100%; transition: 0.2s; } 
.btn-start:hover { background: #219150; } 

/* Header & Timer */ 
.header-cbt { display: flex; flex-direction: column; gap: 10px; border-bottom: 2px solid #27ae60; padding-bottom: 15px; margin-bottom: 20px; } 
@media (min-width: 600px) { 
  .header-cbt { flex-direction: row; justify-content: space-between; align-items: center; } 
} 
#timer-box { background: #27ae60; color: white; padding: 10px 20px; border-radius: 30px; font-weight: bold; font-size: 1.1em; text-align: center; } 
.student-info-bar { background: #e8f8f5; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-weight: 600; color: #2c3e50; display: flex; flex-wrap: wrap; gap: 15px; } 

/* Panel Nomor Soal */ 
.number-panel { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; justify-content: flex-start; } 
.num-btn { width: 38px; height: 38px; border: 1px solid #ddd; background: #f8f9fa; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 0.9em; } 
.num-btn.active { background: #27ae60; color: white; border-color: #219150; } 
.num-btn.filled { background: #2ecc71; color: white; border-color: #27ae60; } 

/* Area Soal & Pilihan */ 
.question-area { background: #fff; padding: 15px; border: 1px solid #e1e4e8; border-radius: 8px; } 
#question-text { font-size: 1.05em; line-height: 1.5; margin-top: 0; } 
.options { list-style: none; padding: 0; margin: 0; } 
.options li { margin: 10px 0; padding: 12px 15px; border: 1px solid #edeff2; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; } 
.options li:hover { background: #e8f8f5; border-color: #27ae60; } 
.options input { margin-right: 12px; transform: scale(1.2); cursor: pointer; } 

/* Navigasi Tombol */ 
.navigation { display: flex; gap: 8px; justify-content: space-between; margin-top: 25px; flex-wrap: wrap; } 
button.nav-btn { padding: 12px 18px; border: none; background: #34495e; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; min-width: 100px; } 
button.nav-btn:hover { opacity: 0.9; } 
button.nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; opacity: 0.6; } 

/* Area Hasil */ 
#result-area { display: none; margin-top: 15px; padding: 20px; background: #ffffff; border-radius: 8px; border: 2px solid #27ae60; } 
.score-box { background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; } 
.key-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; } 

/* Status Pengiriman Apps Script */ 
#drive-status { text-align: center; font-weight: bold; padding: 10px; margin-bottom: 15px; border-radius: 6px; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; } 

/* Tombol Kirim & Aksi */ 
.action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; } 
.btn-send-wa { background: #25D366; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; text-decoration: none; display: inline-block; } 
.btn-send-wa:hover { background: #1eb854; } 
.btn-print { background: #2980b9; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; } 
.btn-print:hover { background: #1f618d; } 
</style> 
</head> 
<body> 
<div class="container"> 
  <!-- Halaman Identitas Siswa --> 
  <div id="identity-screen" class="identity-card"> 
    <h2 style="margin-top:0; color:#2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px;">Formulir Ujian CBT</h2> 
    <form id="student-form" onsubmit="startExam(event)"> 
      <div class="form-group"> 
        <label for="nama">NAMA LENGKAP:</label> 
        <input type="text" id="nama" required placeholder="Masukkan nama lengkap Anda"> 
      </div> 
      <div class="form-group"> 
        <label for="kelas">KELAS:</label> 
        <input type="text" id="kelas" required placeholder="Contoh: XII.1"> 
      </div> 
      <div class="form-group"> 
        <label for="mapel">MATA PELAJARAN - MATERI:</label> 
        <input type="text" id="mapel" required value="BIOLOGI - GEN, KROMOSOM, DNA & RNA" placeholder="Contoh: BIOLOGI - GEN DAN KROMOSOM"> 
      </div> 
      <button type="submit" class="btn-start">Mulai Ujian</button> 
    </form> 
  </div> 

  <!-- Halaman Utama Ujian --> 
  <div id="exam-screen" style="display: none;"> 
    <div class="header-cbt"> 
      <div> 
        <h2 style="margin:0; font-size: 1.4em;">Simulasi CBT Biologi</h2> 
        <small style="color: #666;">Materi: Gen, Kromosom, DNA, dan RNA</small> 
      </div> 
      <div id="timer-box">Sisa Waktu: <span id="timer">40:00</span></div> 
    </div> 
    <div class="student-info-bar"> 
      <span>👤 <span id="disp-nama"></span></span> 
      <span>🏫 <span id="disp-kelas"></span></span> 
      <span>📚 <span id="disp-mapel"></span></span> 
    </div> 
    <div class="number-panel" id="number-panel"></div> 
    <div class="question-area" id="question-container"> 
      <h3 id="question-text">Memuat soal...</h3> 
      <ul class="options" id="options-list"></ul> 
    </div> 
    <div class="navigation"> 
      <button class="nav-btn" id="prev-btn" onclick="manualChange(-1)">Sebelumnya</button> 
      <button class="nav-btn" style="background: #e67e22;" onclick="confirmFinish()">Selesai Ujian</button> 
      <button class="nav-btn" id="next-btn" onclick="manualChange(1)">Selanjutnya</button> 
    </div> 
  </div> 

  <!-- Halaman Hasil & Skor --> 
  <div id="result-area"> 
    <h2 style="margin-top:0; color: #155724; border-bottom: 2px solid #27ae60; padding-bottom: 10px;">Hasil & Laporan Ujian</h2> 
    <div id="drive-status">🔄 Sedang mengunggah hasil tes ke Google Drive...</div> 
    <div class="student-info-bar"> 
      <span>👤 <span id="res-nama"></span></span> 
      <span>🏫 <span id="res-kelas"></span></span> 
      <span>📚 <span id="res-mapel"></span></span> 
    </div> 
    <div class="score-box"> 
      <h1 id="score-text" style="margin: 0; font-size: 2.5em; color: #27ae60;">0</h1> 
      <p style="margin: 5px 0 0 0; font-weight: bold; color: #555;">SKOR AKHIR</p> 
      <p id="score-details" style="margin-top: 10px; font-size: 0.95em; color: #666;"></p> 
    </div> 
    <p><strong>Kunci Jawaban Soal:</strong></p> 
    <div id="key-list" class="key-grid"></div> 
    <div class="action-buttons"> 
      <a id="wa-btn" href="#" target="_blank" class="btn-send-wa">📱 Kirim Hasil ke WhatsApp Guru</a> 
      <button onclick="window.print()" class="btn-print">🖨️ Cetak / Simpan PDF</button> 
    </div> 
  </div> 
</div> 

<script> 
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwe-eizB_tLsiTCKm8zDLU2zOeqbQn81nWmMhmkiVEkne06Zlb7RNr88fz7jU3dVsIO/exec"; 

const questions = [ 
  { 
    q: "Bagian dari kromosom yang berfungsi sebagai tempat melekatnya benang-benang spindel saat pembelahan sel adalah...", 
    a: ["Telomer", "Sentromer", "Kromomer", "Kromatid", "Satelit"], 
    correct: 1 
  }, 
  { 
    q: "Suatu rantai DNA memiliki urutan basa nitrogen rantai sense (templat) sebagai berikut: 5' - TAC - CGT - GCA - ATT - 3'. Urutan basa nitrogen pada rantai antisense adalah...", 
    a: ["3' - ATG - GCA - CGT - TAA - 5'", "5' - ATG - GCA - CGT - TAA - 3'", "3' - AUG - GCA - CGT - UAA - 5'", "5' - AUG - GCA - CGT - UAA - 3'", "3' - UAC - CGU - GCA - AUU - 5'"], 
    correct: 1 
  }, 
  { 
    q: "Pernyataan berikut yang TIDAK benar mengenai perbedaan antara DNA dan RNA adalah...", 
    a: ["DNA memiliki gula deoksiribosa, sedangkan RNA memiliki gula ribosa.", "DNA berbentuk rantai ganda (double helix), sedangkan RNA berbentuk rantai tunggal.", "Basa pirimidin DNA terdiri dari Sitosin dan Timin, sedangkan RNA terdiri dari Sitosin dan Urasil.", "Kadar DNA tetap tidak dipengaruhi sintesis protein, sedangkan kadar RNA berubah-ubah.", "DNA hanya ditemukan di dalam inti sel, sedangkan RNA hanya ditemukan di dalam sitoplasma."], 
    correct: 4 
  }, 
  { 
    q: "Unit terkecil dari materi genetik yang mengendalikan sifat-sifat hereditas suatu organisme dan terletak pada lokus kromosom adalah...", 
    a: ["Gen", "Nukleosida", "Nukleotida", "Kodon", "Basa nitrogen"], 
    correct: 0 
  }, 
  { 
    q: "Komponen penyusun satu nukleotida pada rantai DNA terdiri atas...", 
    a: ["Asam fosfat, gula deoksiribosa, dan basa nitrogen", "Asam fosfat, gula ribosa, dan basa nitrogen", "Gula deoksiribosa dan basa nitrogen", "Gula ribosa dan basa nitrogen", "Asam fosfat dan gula deoksiribosa"], 
    correct: 0 
  }, 
  { 
    q: "Kromosom yang memiliki letak sentromer hampir di ujung, sehingga salah satu lengan kromosom menjadi sangat pendek dan lengan lainnya sangat panjang disebut kromosom...", 
    a: ["Metasentrik", "Submetasentrik", "Akrosentrik", "Telosentrik", "Asektrik"], 
    correct: 2 
  }, 
  { 
    q: "Pasangan basa nitrogen yang tepat pada molekul DNA adalah...", 
    a: ["Adenin dengan Urasil, Guanin dengan Sitosin", "Adenin dengan Timin, Guanin dengan Sitosin", "Adenin dengan Sitosin, Guanin dengan Timin", "Adenin dengan Guanin, Sitosin dengan Timin", "Adenin dengan Timin, Guanin dengan Urasil"], 
    correct: 1 
  }, 
  { 
    q: "Dalam proses sintesis protein, molekul RNA yang bertugas membawa asam amino dari sitoplasma menuju ke ribosom sesuai dengan kodon adalah...", 
    a: ["mRNA (messenger RNA)", "tRNA (transfer RNA)", "rRNA (ribosomal RNA)", "dRNA (dna-like RNA)", "hnRNA (heterogeneous nuclear RNA)"], 
    correct: 1 
  }, 
  { 
    q: "Jika urutan kodon pada mRNA adalah 5' - AUG - GUC - ACU - UAG - 3', maka urutan antikodon pada tRNA yang sesuai adalah...", 
    a: ["3' - UAC - CAG - UGA - AUC - 5'", "3' - TAC - CAG - TGA - ATC - 5'", "5' - UAC - CAG - UGA - AUC - 3'", "3' - AUG - GUC - ACU - UAG - 5'", "5' - TAC - CAG - TGA - ATC - 3'"], 
    correct: 0 
  }, 
  { 
    q: "Manusia memiliki 46 kromosom (23 pasang) di dalam sel tubuhnya (somatis). Penulisan kariotipe kromosom pada sel sperma manusia yang tepat adalah...", 
    a: ["44A + XX", "44A + XY", "22A + X atau 22A + Y", "23A + X atau 23A + Y", "22A + XY"], 
    correct: 2 
  }, 
  { 
    q: "Pasangan variasi gen yang terletak pada lokus yang bersesuaian pada kromosom homolog dinamakan...", 
    a: ["Genom", "Alel", "Nukleosom", "Sentromer", "Histon"], 
    correct: 1 
  }, 
  { 
    q: "Enzim yang berfungsi memutus ikatan hidrogen untuk membuka rantai ganda DNA saat proses replikasi adalah...", 
    a: ["DNA Polimerase", "DNA Ligase", "Helikase", "Primase", "RNA Polimerase"], 
    correct: 2 
  }, 
  { 
    q: "Pernyataan berikut yang tepat mengenai komponen basa purin pada asam nukleat adalah...", 
    a: ["Terdiri dari Adenin dan Timin", "Terdiri dari Guanin dan Sitosin", "Terdiri dari Adenin dan Guanin", "Terdiri dari Sitosin, Timin, dan Urasil", "Terdiri dari Adenin dan Urasil"], 
    correct: 2 
  }, 
  { 
    q: "Tahap pertama dalam sintesis protein di mana informasi genetik dari DNA disalin menjadi mRNA di dalam inti sel disebut...", 
    a: ["Transkripsi", "Translasi", "Replikasi", "Elongasi", "Terminasi"], 
    correct: 0 
  }, 
  { 
    q: "Protein histon yang dikelilingi oleh rantai DNA pembelit sebanyak dua putaran membentuk struktur dasar padat yang disebut...", 
    a: ["Kromomer", "Nukleosom", "Solenoid", "Kromatid", "Sentromer"], 
    correct: 1 
  }, 
  { 
    q: "Ujung kromosom yang berfungsi menjaga stabilitas DNA dari degradasi dinamakan...", 
    a: ["Satelit", "Telomer", "Kinetokor", "Matriks", "Sentromer"], 
    correct: 1 
  }, 
  { 
    q: "Apabila total kandungan basa nitrogen Guanin (G) pada suatu rantai ganda DNA adalah 30%, maka persentase basa Adenin (A) pada DNA tersebut adalah...", 
    a: ["20%", "30%", "40%", "60%", "70%"], 
    correct: 0 
  }, 
  { 
    q: "Bagian dari sel yang menjadi tempat berlangsungnya tahapan translasi dalam sintesis protein adalah...", 
    a: ["Inti sel (Nukleus)", "Ribosom", "Badan Golgi", "Lisosom", "Vakuola"], 
    correct: 1 
  }, 
  { 
    q: "Tipe replikasi DNA yang menyatakan bahwa dua rantai pita DNA untai ganda memisah, kemudian masing-masing pita membentuk pita baru sebagai pasangannya adalah teori...", 
    a: ["Konservatif", "Semikonservatif", "Dispersif", "Fragmentasi", "Duplikasi"], 
    correct: 1 
  }, 
  { 
    q: "Pasangan kodon pada mRNA yang berperan sebagai start codon (kodon inisiasi) untuk memulai sintesis protein adalah...", 
    a: ["UAA", "UAG", "UGA", "AUG", "AGU"], 
    correct: 3 
  } 
]; 

let currentIdx = 0; 
let userAnswers = new Array(questions.length).fill(null); 
let totalTime = 2400; // 40 Menit Ujian (dalam detik) 
let timerInterval; 
let studentData = { nama: '', kelas: '', mapel: '' }; 

function startExam(event) { 
  event.preventDefault(); 
  studentData.nama = document.getElementById('nama').value.trim(); 
  studentData.kelas = document.getElementById('kelas').value.trim(); 
  studentData.mapel = document.getElementById('mapel').value.trim(); 

  document.getElementById('disp-nama').innerText = studentData.nama; 
  document.getElementById('disp-kelas').innerText = studentData.kelas; 
  document.getElementById('disp-mapel').innerText = studentData.mapel; 

  document.getElementById('identity-screen').style.display = 'none'; 
  document.getElementById('exam-screen').style.display = 'block'; 
  initExam(); 
} 

function initExam() { 
  renderPanel(); 
  showQuestion(); 
  startGlobalTimer(); 
} 

function startGlobalTimer() { 
  timerInterval = setInterval(() => { 
    totalTime--; 
    updateTimerDisplay(); 
    if (totalTime <= 0) { 
      clearInterval(timerInterval); 
      alert("Waktu ujian telah habis!"); 
      finishQuiz(); 
    } 
  }, 1000); 
} 

function updateTimerDisplay() { 
  const minutes = Math.floor(totalTime / 60); 
  const seconds = totalTime % 60; 
  document.getElementById('timer').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`; 
  const box = document.getElementById('timer-box'); 
  if (totalTime < 300) box.style.background = "#e74c3c"; 
  else box.style.background = "#27ae60"; 
} 

function showQuestion() { 
  const q = questions[currentIdx]; 
  document.getElementById('question-text').innerText = `Soal ${currentIdx + 1}: ${q.q}`; 
  const list = document.getElementById('options-list'); 
  list.innerHTML = ''; 
  q.a.forEach((opt, i) => { 
    const li = document.createElement('li'); 
    const char = String.fromCharCode(65 + i); 
    li.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentIdx] === i ? 'checked' : ''}> <b>${char}.</b> &nbsp; ${opt}`; 
    li.onclick = () => saveAnswer(i); 
    list.appendChild(li); 
  }); 
  document.getElementById('prev-btn').disabled = currentIdx === 0; 
  document.getElementById('next-btn').disabled = currentIdx === questions.length - 1; 
  renderPanel(); 
} 

function saveAnswer(i) { 
  userAnswers[currentIdx] = i; 
  showQuestion(); 
} 

function manualChange(step) { 
  currentIdx += step; 
  showQuestion(); 
} 

function renderPanel() { 
  const panel = document.getElementById('number-panel'); 
  panel.innerHTML = ''; 
  questions.forEach((_, i) => { 
    const btn = document.createElement('button'); 
    btn.innerText = i + 1; 
    let cls = 'num-btn'; 
    if (i === currentIdx) cls += ' active'; 
    if (userAnswers[i] !== null) cls += ' filled'; 
    btn.className = cls; 
    btn.onclick = () => { 
      currentIdx = i; 
      showQuestion(); 
    }; 
    panel.appendChild(btn); 
  }); 
} 

function confirmFinish() { 
  const answeredCount = userAnswers.filter(a => a !== null).length; 
  if (confirm(`Anda telah menjawab ${answeredCount} dari ${questions.length} soal. Yakin ingin mengakhiri ujian?`)) { 
    finishQuiz(); 
  } 
} 

function finishQuiz() { 
  clearInterval(timerInterval); 
  let score = 0; 
  let keyHtml = ''; 
  questions.forEach((q, i) => { 
    if(userAnswers[i] === q.correct) score++; 
    keyHtml += `<div style="background:#fff; padding:6px; border-radius:4px; border:1px solid #c3e6cb;">Soal ${i+1}: <b>${String.fromCharCode(65 + q.correct)}</b></div>`; 
  }); 
  const finalScore = (score / questions.length) * 100; 
  const wrongCount = questions.length - score; 

  // Render Data Hasil Siswa 
  document.getElementById('res-nama').innerText = studentData.nama; 
  document.getElementById('res-kelas').innerText = studentData.kelas; 
  document.getElementById('res-mapel').innerText = studentData.mapel; 
  document.getElementById('score-text').innerText = finalScore; 
  document.getElementById('score-details').innerText = `Benar: ${score} Soal | Salah: ${wrongCount} Soal | Total: ${questions.length} Soal`; 
  document.getElementById('key-list').innerHTML = keyHtml; 

  // Tautan WhatsApp 
  const guruPhone = "6285334943686"; 
  const messageText = `*LAPORAN HASIL UJIAN CBT*\n\n` + 
    `*Nama:* ${studentData.nama}\n` + 
    `*Kelas:* ${studentData.kelas}\n` + 
    `*Mata Pelajaran:* ${studentData.mapel}\n` + 
    `*Nilai Akhir:* ${finalScore}\n` + 
    `*Detail Jawaban:* Benar ${score} / Salah ${wrongCount} dari ${questions.length} Soal`; 
  const waUrl = `https://api.whatsapp.com/send?phone=${guruPhone}&text=${encodeURIComponent(messageText)}`; 
  document.getElementById('wa-btn').setAttribute('href', waUrl); 

  // Tampilkan Layar Hasil 
  document.getElementById('exam-screen').style.display = 'none'; 
  document.getElementById('result-area').style.display = 'block'; 
  window.scrollTo({ top: 0, behavior: 'smooth' }); 

  // Proses Pengiriman Otomatis ke Apps Script 
  const statusBox = document.getElementById("drive-status"); 
  fetch(URL_SCRIPT, { 
    method: "POST", 
    mode: "no-cors", 
    headers: { 
      "Content-Type": "application/json" 
    }, 
    body: JSON.stringify({ 
      nama: studentData.nama, 
      kelas: studentData.kelas, 
      nilai: finalScore 
    }) 
  }) 
  .then(() => { 
    statusBox.style.background = "#d4edda"; 
    statusBox.style.color = "#155724"; 
    statusBox.style.borderColor = "#c3e6cb"; 
    statusBox.innerHTML = "✅ Hasil tes berhasil tersimpan!"; 
  }) 
  .catch(error => { 
    console.error("Error:", error); 
    statusBox.style.background = "#f8d7da"; 
    statusBox.style.color = "#721c24"; 
    statusBox.style.borderColor = "#f5c6cb"; 
    statusBox.innerHTML = "⚠️ Gagal mengunggah otomatis. Gunakan tombol Kirim WhatsApp di bawah."; 
  }); 
} 
</script> 
</body> 
</html>
